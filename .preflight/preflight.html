<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ==========================================================================
   一人公司办公系统 — Brand CSS (商务质感)
   ========================================================================== */

:root {
  /* —— 主色：深海军蓝 —— */
  --color-primary-50:  #eef2f9;
  --color-primary-100: #d6e0f0;
  --color-primary-200: #adc1e1;
  --color-primary-300: #7a9bcd;
  --color-primary-400: #4a73b0;
  --color-primary-500: #2f5697;
  --color-primary-600: #1f3f7a;
  --color-primary-700: #16305e;
  --color-primary-800: #102547;
  --color-primary-900: #0a1a33;

  /* —— 中性面 —— */
  --color-neutral-0:   #ffffff;
  --color-neutral-50:  #f7f8fa;
  --color-neutral-100: #eef0f4;
  --color-neutral-200: #e2e6ed;
  --color-neutral-300: #cdd4df;
  --color-neutral-400: #9aa3b2;
  --color-neutral-500: #6b7280;
  --color-neutral-600: #4b5563;
  --color-neutral-700: #374151;
  --color-neutral-800: #1f2937;
  --color-neutral-900: #111827;

  /* —— 语义状态色（仅语义状态使用） —— */
  --state-success: #1f9d6e;
  --state-warning: #d98a0a;
  --state-error:   #d63b3b;
  --state-info:    #2f5697;

  /* —— 语义别名（fill-html-head.mjs 解析） —— */
  --color-background:         #f7f8fa;
  --color-foreground:         #1f2937;
  --color-card:               #ffffff;
  --color-card-foreground:    #1f2937;
  --color-popover:            #ffffff;
  --color-popover-foreground: #1f2937;
  --color-primary:            #1f3f7a;
  --color-primary-foreground: #ffffff;
  --color-muted:              #f1f3f8;
  --color-muted-foreground:   #6b7280;
  --color-border:             #e2e6ed;
  --color-input:              #e2e6ed;
  --color-ring:               #2f5697;

  /* —— 圆角尺度（克制） —— */
  --radius-sm:   4px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-full: 9999px;

  /* —— 前缀语义别名（fill-html-head.mjs 解析） —— */
  --office-background:          #f7f8fa;
  --office-foreground:          #1f2937;
  --office-card:                #ffffff;
  --office-card-foreground:     #1f2937;
  --office-popover:             #ffffff;
  --office-popover-foreground:  #1f2937;
  --office-primary:             #1f3f7a;
  --office-primary-foreground:  #ffffff;
  --office-muted:               #f1f3f8;
  --office-muted-foreground:    #6b7280;
  --office-border:              #e2e6ed;
  --office-input:               #e2e6ed;
  --office-ring:                #2f5697;
  --office-radius-sm:   4px;
  --office-radius-md:   8px;
  --office-radius-lg:   12px;

  /* —— 阴影模型（静态面以边框为主，浮动层可用稍深阴影） —— */
  --shadow-xs: 0 1px 2px rgba(16, 37, 71, 0.04);
  --shadow-sm: 0 2px 6px rgba(16, 37, 71, 0.05);
  --shadow-md: 0 8px 24px rgba(16, 37, 71, 0.10);
  --shadow-lg: 0 16px 40px rgba(16, 37, 71, 0.14);

  /* —— 排版系统 —— */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
}

/* —— Dark mode（预留） —— */
.dark {
  --color-background:         #0a1a33;
  --color-foreground:         #e2e6ed;
  --color-card:               #102547;
  --color-card-foreground:    #e2e6ed;
  --color-popover:            #102547;
  --color-popover-foreground: #e2e6ed;
  --color-primary:            #4a73b0;
  --color-primary-foreground: #ffffff;
  --color-muted:              #16305e;
  --color-muted-foreground:   #9aa3b2;
  --color-border:             #1f3f7a;
  --color-input:              #1f3f7a;
  --color-ring:               #7a9bcd;
}

/* —— 字体类 —— */
.font-display { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.01em; }
.font-body    { font-family: var(--font-sans); font-weight: 400; }
.font-mono    { font-family: var(--font-mono); }

/* —— 标题层级 —— */
.text-h1 { font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
.text-h2 { font-size: 22px; line-height: 1.3;  font-weight: 600; letter-spacing: -0.005em; }
.text-h3 { font-size: 17px; line-height: 1.35; font-weight: 600; }
.text-h4 { font-size: 14px; line-height: 1.4;  font-weight: 600; }

/* —— 正文层级 —— */
.text-body    { font-size: 14px; line-height: 1.6; font-weight: 400; }
.text-body-sm { font-size: 13px; line-height: 1.55; font-weight: 400; }
.text-caption { font-size: 12px; line-height: 1.5;  font-weight: 400; color: var(--color-muted-foreground); }
.text-overline { font-size: 11px; line-height: 1.4; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-muted-foreground); }

/* —— 颜色工具类 —— */
.text-primary         { color: var(--color-primary); }
.text-primary-foreground { color: var(--color-primary-foreground); }
.text-muted-foreground { color: var(--color-muted-foreground); }
.text-foreground       { color: var(--color-foreground); }

.bg-primary           { background-color: var(--color-primary); }
.bg-primary-foreground{ background-color: var(--color-primary-foreground); }
.bg-card              { background-color: var(--color-card); }
.bg-muted             { background-color: var(--color-muted); }
.bg-background        { background-color: var(--color-background); }

.border-border        { border-color: var(--color-border); }
.ring-ring            { --tw-ring-color: var(--color-ring); }

/* —— 状态文字色 —— */
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error   { color: var(--state-error); }
.text-info    { color: var(--state-info); }

.bg-success-soft { background-color: rgba(31, 157, 110, 0.10); }
.bg-warning-soft { background-color: rgba(217, 138, 10, 0.12); }
.bg-error-soft   { background-color: rgba(214, 59, 59, 0.10); }
.bg-info-soft    { background-color: rgba(47, 86, 151, 0.10); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--office-background);
    --color-foreground: var(--office-foreground);
    --color-card: var(--office-card);
    --color-card-foreground: var(--office-card-foreground);
    --color-popover: var(--office-popover);
    --color-popover-foreground: var(--office-popover-foreground);
    --color-primary: var(--office-primary);
    --color-primary-foreground: var(--office-primary-foreground);
    --color-muted: var(--office-muted);
    --color-muted-foreground: var(--office-muted-foreground);
    --color-border: var(--office-border);
    --color-input: var(--office-input);
    --color-ring: var(--office-ring);
    --radius-sm: var(--office-radius-sm);
    --radius-md: var(--office-radius-md);
    --radius-lg: var(--office-radius-lg);
  }
  @layer base {
    body { background: var(--office-background); color: var(--office-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
